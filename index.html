<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TACTICAL COMMAND</title>
    <meta name="description" content="Turn-based tactical combat game. Build squads, deploy units, and outmaneuver your opponent." />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COMAND" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Boot splash — shown before React mounts, removed by main.tsx */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: radial-gradient(ellipse at 50% 40%, #141416 0%, #09090b 70%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; transition: opacity 0.4s ease; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #boot-splash.boot-done { opacity: 0; pointer-events: none; }
      .boot-radar { position: relative; width: 88px; height: 88px; }
      .boot-radar span {
        position: absolute; inset: 0; border: 1px solid rgba(251,191,36,0.45);
        border-radius: 50%; animation: boot-ping 2.2s cubic-bezier(0,0,0.2,1) infinite;
      }
      .boot-radar span:nth-child(2) { animation-delay: 0.55s; }
      .boot-radar span:nth-child(3) { animation-delay: 1.1s; }
      .boot-radar::after {
        content: ""; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
        margin: -5px 0 0 -5px; border-radius: 50%; background: #fbbf24;
        box-shadow: 0 0 18px rgba(251,191,36,0.8);
      }
      @keyframes boot-ping { 0% { transform: scale(0.15); opacity: 1; } 80%, 100% { transform: scale(1); opacity: 0; } }
      .boot-title { text-align: center; letter-spacing: 0.28em; font-weight: 800; font-size: 22px; line-height: 1.35; text-transform: uppercase; }
      .boot-title .t1 { color: #e4e4e7; display: block; }
      .boot-title .t2 { color: #fbbf24; display: block; text-shadow: 0 0 24px rgba(251,191,36,0.35); }
      .boot-sub { color: #52525b; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; animation: boot-blink 1.6s steps(2) infinite; }
      @keyframes boot-blink { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-radar span, .boot-sub { animation: none; }
        .boot-radar span { opacity: 0.3; transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-radar"><span></span><span></span><span></span></div>
      <div class="boot-title"><span class="t1">Tactical</span><span class="t2">Command</span></div>
      <div class="boot-sub">Establishing uplink</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
